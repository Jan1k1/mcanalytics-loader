name: MCAnalyticsLoader
version: ${version}
main: net.sniffstudio.mcanalytics.loader.paper.PaperLoaderPlugin
description: Downloads, verifies and runs the MCAnalytics connector on a Paper server
author: SniffStudio
website: https://github.com/Jan1k1/mcanalytics-loader
api-version: "1.20"
folia-supported: true
commands:
  mca:
    description: MCAnalytics loader command
    aliases: [mcanalytics]
    permission: mcanalytics.admin
    usage: /<command> [pair|status|update]
permissions:
  mcanalytics.admin:
    description: Allows pairing, status and update of the MCAnalytics loader
    default: op
